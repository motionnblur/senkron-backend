services:
  postgres:
    image: postgres:16
    container_name: senkron-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: senkron
      POSTGRES_USER: senkron
      POSTGRES_PASSWORD: senkron
    ports:
      - "5432:5432"
    volumes:
      - senkron-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senkron -d senkron"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  senkron-postgres-data:

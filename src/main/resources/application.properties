spring.application.name=senkron-backend

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# App
app.jwt.secret=${JWT_SECRET:dev-jwt-secret-key-min-32-chars!!}
app.jwt.expiration-hours=168
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=None
app.oauth2.success-url=${OAUTH2_SUCCESS_URL:http://localhost:3000/auth/callback}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

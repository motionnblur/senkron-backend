spring.datasource.url=jdbc:h2:mem:senkron-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.jwt.secret=test-jwt-secret-key-min-32-chars!!
app.jwt.expiration-hours=168
app.cookie.secure=false
app.cookie.same-site=Lax
app.oauth2.success-url=http://localhost:3000/auth/callback
app.cors.allowed-origins=http://localhost:3000
